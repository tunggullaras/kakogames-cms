<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Masuk Admin — Kakogames CMS</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --purple:#5B3DF5;--purple-dark:#4527D6;--orange:#F5A623;
    --cream:#FBF4E7;--ink:#1B1330;--ink-soft:#5c5470;--line:#e7e0f5;--navy:#150F2E;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{
    font-family:'Plus Jakarta Sans',sans-serif;
    background:linear-gradient(135deg,var(--navy) 0%, #241a4a 100%);
    min-height:100vh;display:flex;align-items:center;justify-content:center;
    color:var(--ink);
  }
  .card{
    background:#fff;border-radius:20px;padding:44px 40px;width:100%;max-width:400px;
    box-shadow:0 20px 60px rgba(0,0,0,.35);
    border:2px solid var(--ink);
  }
  .logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:20px;margin-bottom:6px;}
  .logo-mark{
    width:36px;height:36px;border-radius:10px;
    background:linear-gradient(135deg,var(--orange),var(--purple));
    display:flex;align-items:center;justify-content:center;
    font-family:'JetBrains Mono';font-weight:700;color:#fff;font-size:11px;
  }
  .logo span{color:var(--purple);}
  .eyebrow{
    font-family:'JetBrains Mono';font-size:11px;color:var(--purple-dark);
    letter-spacing:.08em;margin:18px 0 4px;
  }
  h1{font-size:24px;font-weight:800;margin-bottom:26px;}
  label{display:block;font-size:13px;font-weight:700;margin-bottom:7px;color:var(--ink-soft);}
  input{
    width:100%;padding:12px 14px;border:1.5px solid var(--line);border-radius:10px;
    font-family:inherit;font-size:14px;margin-bottom:18px;transition:border-color .15s;
  }
  input:focus{outline:none;border-color:var(--purple);}
  button{
    width:100%;padding:14px;border-radius:12px;border:2px solid var(--ink);
    background:var(--orange);font-weight:800;font-size:15px;cursor:pointer;
    box-shadow:4px 4px 0 var(--ink);transition:transform .15s;
  }
  button:hover{transform:translateY(-2px);}
  button:disabled{opacity:.6;cursor:not-allowed;transform:none;}
  .error{
    background:#fdecec;border:1px solid #f5b5b5;color:#a02020;font-size:13px;
    padding:10px 14px;border-radius:10px;margin-bottom:16px;display:none;
  }
  .hint{margin-top:20px;font-size:12px;color:var(--ink-soft);text-align:center;}
</style>
</head>
<body>
  <div class="card">
    <div class="logo"><div class="logo-mark">KG</div>kako<span>games</span></div>
    <div class="eyebrow">CMS ADMIN</div>
    <h1>Masuk ke Dashboard</h1>
    <div class="error" id="errorBox"></div>
    <form id="loginForm">
      <label for="email">Email</label>
      <input type="email" id="email" name="email" placeholder="admin@kakogames.id" required autocomplete="username">
      <label for="password">Password</label>
      <input type="password" id="password" name="password" placeholder="••••••••" required autocomplete="current-password">
      <button type="submit" id="submitBtn">Masuk</button>
    </form>
    <div class="hint">Akses khusus tim Kakogames. Hubungi admin utama jika lupa password.</div>
  </div>

<script>
  const form = document.getElementById('loginForm');
  const errorBox = document.getElementById('errorBox');
  const submitBtn = document.getElementById('submitBtn');

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    errorBox.style.display = 'none';
    submitBtn.disabled = true;
    submitBtn.textContent = 'Memeriksa...';

    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;

    try {
      const res = await fetch('/api/auth/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, password }),
      });
      const data = await res.json();
      if (!res.ok) {
        errorBox.textContent = data.error || 'Login gagal. Coba lagi.';
        errorBox.style.display = 'block';
        submitBtn.disabled = false;
        submitBtn.textContent = 'Masuk';
        return;
      }
      window.location.href = '/admin/dashboard';
    } catch (err) {
      errorBox.textContent = 'Tidak bisa terhubung ke server. Coba lagi.';
      errorBox.style.display = 'block';
      submitBtn.disabled = false;
      submitBtn.textContent = 'Masuk';
    }
  });
</script>
</body>
</html>
